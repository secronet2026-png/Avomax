# Nginx Configuration for single domain deployment:
# abc.com        -> Avomax Website
# abc.com/crm    -> AvomaxCRM Application
# abc.com/api    -> AvomaxCRM Backend REST API

server {
    listen 80;
    server_name abc.com www.abc.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name abc.com www.abc.com;

    # SSL Certificates (e.g. Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/abc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Main Website at root (abc.com/)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Redirect /crm without slash to /crm/
    location = /crm {
        return 301 /crm/;
    }

    # 3. CRM Application at /crm/ (abc.com/crm/)
    # Option A: Proxy to running CRM Node/Vite preview container on port 5173:
    location /crm/ {
        proxy_pass http://127.0.0.1:5173/crm/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Option B (Static Build): If serving built static files directly:
    # location /crm/ {
    #     alias /var/www/avomax/edu_crm/frontend/dist/;
    #     try_files $uri $uri/ /crm/index.html;
    #     index index.html;
    # }

    # 4. CRM Backend API at /api/ (abc.com/api/)
    location /api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }
}

